<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルWebサイト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding-bottom: 100px;
      font-family: Arial, sans-serif;
      color: #333;
      background-color: #f5f5f5;
    }

    header {
      padding: 30px 20px;
      text-align: center;
      color: white;
      background-color: #440000;
    }

    header h1 {
      margin: 0;
    }

    main {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }

    section {
      margin-bottom: 30px;
      padding: 25px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    section h2 {
      margin-top: 0;
      color: #3498db;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 15px 20px;
      text-align: center;
      color: white;
      background-color: #2c3e50;
    }

    footer p {
      margin: 5px 0;
    }

    footer a {
      margin: 0 8px;
      color: #74c0fc;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

<header>
  <h1>バレーボールサークル</h1>
  <img src="https://github.com/miyagawayuu0311/volleyball/blob/main/cupcake.jpg?raw=true" alt="バレーボールサークルの写真">
</header>

<main>
  <section>
    <h2>活動内容</h2>
    <p>
      週2回、名古屋市内の体育館で練習しています。
      長期休みには合宿を行い、サークル内でトーナメント戦をします。
    </p>
  </section>

  <section>
    <h2>新入生について</h2>
    <p>
      初心者・経験者を問わず、新入生を歓迎しています。
      バレーボールが好きな方はもちろん、大学生活で新しい仲間を作りたい方も大歓迎です。
      興味のある方は、ぜひお気軽にお問い合わせください。
    </p>
  </section>
</main>

<footer>
  <p>お問い合わせ：info@example.com</p>
  <p>
    <a href="https://twitter.com/" target="_blank">X</a>
    <a href="https://www.instagram.com/" target="_blank">Instagram</a>
    <a href="https://www.facebook.com/" target="_blank">Facebook</a>
  </p>
</footer>

</body>
</html>
